name: Build Linux

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 and arm64 are both first-class desktop hosts: the prebuilt Slang has a
          # linux-aarch64 build, so arm64 builds the full compiler + runs the tests too.
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: ".xmake-cache"
          build-cache: true

      - name: Install dependencies
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=600 update && sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=600 install build-essential cmake git clang -y

      - name: Cache Build
        run: xmake f --policies=build.ccache:y -y

      - name: Build
        run: git config --global pull.rebase false && xmake repo -u && xmake -vD -y

      # Builds and runs the doctest suite (drives the Slang pipeline + runtime format).
      - name: Test
        run: xmake test -v

      - name: Show install error log
        if: failure()
        run: |
          find "$HOME/.xmake" -name install.txt -exec echo "==== {} ====" \; -exec cat {} \; || true
