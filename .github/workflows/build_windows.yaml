name: Build Windows

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolset_label: v142
            vs: "2022"
            vs_toolset: "14.29"
          - toolset_label: v143
            vs: "2022"
            vs_toolset: "14.3"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: ".xmake-cache"
          build-cache: true

      - name: Setup MSVC Dev Cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: ${{ matrix.vs_toolset }}

      - name: Cache Build
        run: xmake f -m release -p windows -a x64 --vs=${{ matrix.vs }} --vs_toolset=${{ matrix.vs_toolset }} --policies=build.ccache:y -y

      - name: Build
        shell: pwsh
        run: xmake repo -u && xmake -vD -y

      - name: Show install error log
        if: failure()
        run: |
          find /home/runner/.xmake/cache -name install.txt -exec echo "==== {} ====" \; -exec cat {} \;
