name: Build macOS

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: ".xmake-cache"
          build-cache: true

      - name: Cache Build
        run: xmake f --policies=build.ccache:y -y

      - name: Build
        run: git config --global pull.rebase false && xmake repo -u && xmake -vD -y

      # Builds and runs the doctest suite (drives the Slang pipeline + runtime format).
      - name: Test
        run: xmake test -v

      - name: Show install error log
        if: failure()
        run: |
          find "$HOME/.xmake" -name install.txt -exec echo "==== {} ====" \; -exec cat {} \; || true
